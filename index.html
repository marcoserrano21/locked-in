<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#070A10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Locked-In" />
    <title>Locked-In</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #070a10;
        color: #f2f5f8;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.35s ease;
      }
      #app-splash.is-leaving {
        opacity: 0;
      }
      #app-splash .splash-mark {
        width: 72px;
        height: 72px;
      }
      #app-splash .splash-word {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 2rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #app-splash .splash-pulse {
        width: 36px;
        height: 3px;
        margin-top: 1.25rem;
        border-radius: 999px;
        background: color-mix(in srgb, #3dffb5 55%, transparent);
        opacity: 0;
        animation: splash-wait 0.9s ease 1s infinite alternate;
      }
      @keyframes splash-wait {
        from { opacity: 0.25; transform: scaleX(0.7); }
        to { opacity: 1; transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition: none; }
        #app-splash .splash-pulse { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body class="bg-ink text-mist font-body antialiased">
    <div id="app-splash" aria-hidden="true">
      <img class="splash-mark" src="/icons/icon.svg" alt="" width="72" height="72" />
      <p class="splash-word">Locked-In</p>
      <div class="splash-pulse" aria-hidden="true"></div>
    </div>
    <div id="app" class="min-h-dvh"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
